[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "primebox"
version = "0.1.0"
description = "Pioneer DJ XDJ-RX3 rekordbox standalone player interoperability layer for Denon DJ Prime GO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.20.0",
    "pycdlib>=1.14.0",
]

[project.scripts]
primebox-prepare = "primebox.bundle.prepare_rx3:main"
primebox-launcher = "primebox.launcher.setup_launcher:main"
primebox-patch = "primebox.patch.patch_rbp:main"
primebox-verify-module = "primebox.verify.verify_module:main"
primebox-verify-links = "primebox.verify.verify_links:main"

[dependency-groups]
dev = [
    "coverage>=7.6.0",
]

[tool.coverage.run]
source = ["src/primebox"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
